[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "aind-ophys-classifier-library"
description = "ROI soma/dendrite classification for AIND ophys pipelines"
license = "MIT"
# CEILING: roicat 1.7.3 declares Requires-Python >=3.11,<3.13. Verified
# 2026-07-30 by execution: 3.10.19 fails to RESOLVE ("Because the current
# Python version (3.10.19) does not satisfy Python>=3.11,<3.13"), 3.11 and
# 3.12 both install and import. 3.13/3.14 are unreachable until roicat lifts
# its own bound. The Code Ocean runtime image is python3.12.4, so 3.12 is the
# deployment target.
requires-python = ">=3.11,<3.13"
authors = [
    {name = "Allen Institute for Neural Dynamics"}
]
classifiers = [
    "Programming Language :: Python :: 3"
]
readme = "README.md"
version = "0.1.0"

dependencies = [
    # These two move together: aind-data-schema 2.9.0 requires
    # aind-data-schema-models >=6.1.0,<7, so pinning either alone leaves the
    # environment unresolvable.
    "aind-data-schema==2.9.0",
    "aind-data-schema-models==6.2.0",
    "aind-pophys-metadata @ git+https://github.com/AllenNeuralDynamics/aind-pophys-metadata.git@v0.2.0",
    "log-schema[cloudwatch] @ git+https://github.com/AllenNeuralDynamics/aind-log-utils.git@f09685e#subdirectory=python",
    "roicat[all]==1.7.3",
    # Exact pins, resolved in the 3.12 target env then verified to install AND
    # import on the 3.11 floor. torch is imported directly (gpu_name), so it is
    # pinned at the version roicat resolves; torchvision stays transitive.
    "sparse==0.18.0",
    "h5py==3.16.0",
    "matplotlib==3.10.8",
    "numpy==2.4.4",
    "pillow==12.1.1",
    "pydantic==2.11.10",
    "pydantic-settings==2.14.2",
    "pytz==2026.3.post1",
    "torch==2.11.0",
]

[dependency-groups]
dev = [
    'black',
    'coverage',
    'flake8',
    'interrogate',
    'isort',
    'Sphinx',
    'furo'
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target_version = ['py310']
exclude = '''

(
  /(
      \.eggs         # exclude a few common directories in the
    | \.git          # root of the project
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | build
    | dist
    | .conda
  )/
  | .gitignore
)
'''

[tool.coverage.run]
# Temporarily omitted, inherited from a production capsule without unit tests:
# classification.py is the ROICaT/GPU compute and job.py the orchestration a
# real data run exercises end to end. Every other module is held at 100%.
omit = [
    "*__init__*",
    "*/aind_ophys_classifier_library/classification.py",
    "*/aind_ophys_classifier_library/job.py",
]
source = ["aind_ophys_classifier_library", "tests"]

[tool.coverage.report]
exclude_lines = [
    "if __name__ == .__main__.:",
    "^from .* import .*",
    "^import .*",
    "pragma: no cover"
]
fail_under = 100

[tool.isort]
line_length = 100
profile = "black"
skip = [".conda", ".venv"]

[tool.interrogate]
exclude = ["setup.py", "docs", "build", ".conda"]
fail-under = 100
