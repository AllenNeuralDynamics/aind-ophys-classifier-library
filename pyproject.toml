[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "aind-ophys-classifier-library"
description = "ROI soma/dendrite classification for AIND ophys pipelines"
license = "MIT"
requires-python = ">=3.11,<3.13"
authors = [
    {name = "Allen Institute for Neural Dynamics"}
]
classifiers = [
    "Programming Language :: Python :: 3"
]
readme = "README.md"
version = "0.1.0"

dependencies = [
    "aind-data-schema==2.9.0",
    "aind-data-schema-models==6.2.0",
    "aind-pophys-metadata @ git+https://github.com/AllenNeuralDynamics/aind-pophys-metadata.git@4fdfb2e9704d756bf459fea5520740c7c07aadc4",
    "log-schema[cloudwatch] @ git+https://github.com/AllenNeuralDynamics/aind-log-utils.git@f09685e#subdirectory=python",
    "roicat[all]==1.7.3",
    "sparse==0.18.0",
    "h5py==3.16.0",
    "matplotlib==3.10.8",
    "numpy==2.4.4",
    "pillow==12.1.1",
    "pydantic==2.11.10",
    "pydantic-settings==2.14.2",
    "pytz==2026.3.post1",
    "torch==2.11.0",
]

[project.urls]
Repository = "https://github.com/AllenNeuralDynamics/aind-ophys-classifier-library"

[dependency-groups]
dev = [
    'black',
    'coverage',
    'flake8',
    'interrogate',
    'isort',
    'Sphinx',
    'furo'
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target_version = ['py310']
exclude = '''

(
  /(
      \.eggs         # exclude a few common directories in the
    | \.git          # root of the project
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | build
    | dist
    | .conda
  )/
  | .gitignore
)
'''

[tool.coverage.run]
omit = [
    "*__init__*",
    "*/aind_ophys_classifier_library/classification.py",
    "*/aind_ophys_classifier_library/job.py",
]
source = ["aind_ophys_classifier_library", "tests"]

[tool.coverage.report]
exclude_lines = [
    "if __name__ == .__main__.:",
    "^from .* import .*",
    "^import .*",
    "pragma: no cover"
]
fail_under = 100

[tool.isort]
line_length = 100
profile = "black"
skip = [".conda", ".venv"]

[tool.interrogate]
exclude = ["setup.py", "docs", "build", ".conda"]
fail-under = 100
